name: Format experimental SML branch
on:
  push:
    branches: [feat/p0-layout-actions-p1-components-20261021]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format checked-in Go files
        run: |
          gofmt -w $(git ls-files '*.go')
          go mod tidy
          git diff --check
          git add -A -- '*.go' go.mod go.sum
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: gofmt SML engine code'
            git push origin HEAD:feat/p0-layout-actions-p1-components-20261021
          fi

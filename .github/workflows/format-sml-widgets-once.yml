name: Format SML widget patch (one-time)

on:
  push:
    branches: [tools/format-sml-widgets]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/terminal-dashboard-widgets
          persist-credentials: true
      - name: Apply gofmt to SML widgets
        run: |
          gofmt -w internal/engine/widgets_dashboard.go internal/engine/widgets_dashboard_test.go internal/engine/interaction.go internal/engine/localized_control_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/engine/widgets_dashboard.go internal/engine/widgets_dashboard_test.go internal/engine/interaction.go internal/engine/localized_control_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style(sml): gofmt dashboard widget implementation and tests"
            git push origin HEAD:refs/heads/feat/terminal-dashboard-widgets
          fi
      - name: Verify SML widget tests
        run: |
          go test ./internal/engine ./...
          go vet ./...

name: One-time SML glow formatting
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-sml-glow]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply gofmt and commit
        run: |
          gofmt -w internal/engine/style.go internal/engine/datatable.go internal/engine/layout.go internal/engine/interaction.go internal/engine/glow.go internal/engine/glow_test.go sml.go examples/glow-demo/main.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/engine/style.go internal/engine/datatable.go internal/engine/layout.go internal/engine/interaction.go internal/engine/glow.go internal/engine/glow_test.go sml.go examples/glow-demo/main.go
            git commit -m "style(sml): gofmt native panel and table glow"
            git push origin HEAD:main
          fi

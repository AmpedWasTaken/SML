name: Format Go sources (maintainer branch)
on:
  push:
    branches: ['refactor/clean-go-package-and-docs-20261021']
permissions:
  contents: write
jobs:
  gofmt:
    if: ${{ !contains(github.event.head_commit.message, '[gofmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format all Go source
        run: gofmt -w $(git ls-files '*.go')
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- '*.go'; then
            echo 'Go source already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.go'
          git commit -m 'style: apply gofmt to Go source [gofmt]'
          git push origin HEAD:${{ github.ref_name }}

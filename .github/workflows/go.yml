name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests, vet, and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate example screen
        run: go run ./cmd/sml validate examples/quickstart.sml
      - name: Validate asset tree
        run: go run ./cmd/sml validate examples/assets
      - name: Render example
        run: go run ./cmd/sml render -set app.health=online -set app.cpu=37 examples/quickstart.sml
